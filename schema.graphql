  updateAgentSingle(set: UpdateAgentInput!, where: AgentFilters!): Agent
  deleteAgent(where: AgentFilters): [Agent!]!
  deleteAgentSingle(where: AgentFilters!): Agent
  createMcpServers(values: [CreateMcpServerInput!]!): [McpServer!]!
