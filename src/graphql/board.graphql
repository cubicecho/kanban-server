query Board($projectId: String!, $limit: Int!) {
  lanes(
    where: { projectId: { eq: $projectId } }
    orderBy: { position: { direction: asc, priority: 1 } }
  ) {
    id
    name
    position
    intake
    roleId
    prompt
    agentId
    onSuccessLaneId
    onFailureLaneId
    archiveOnSuccess
    wipLimit
    maxAttempts
  }
  # Archived cards are off the board by definition — see archive.graphql for the other half.
  cards(
    limit: $limit
    where: { projectId: { eq: $projectId }, archivedAt: { isNull: true } }
    orderBy: { position: { direction: asc, priority: 1 } }
  ) {
    id
    laneId
    taskId
    title
    body
    acceptance
    position
    status
    error
    attempts
    updatedAt
    deps {
      dependsOnCardId
    }
  }
}

# What the cards on a board carry that is not on the card: a person's notes, and a reviewer's
# reason for sending it back. Its own query rather than a relation on `Board`, which draws up to
# five hundred cards every three seconds — a relation there is five hundred queries a tick, and
# this is one for the whole board. Cards with neither are simply absent from the answer.
query CardMarks($projectId: String!) {
  cardMarks(projectId: $projectId) {
    cardId
    notes
    rejection
  }
}

# The archived cards, by lane, and nothing else about them.
#
# `Board` filters them out — correctly, they are off the board — but deleting a lane cascades to
# them, and the guard that matters is the one for what you cannot see: a lane holding nothing but
# archived cards looked empty and offered a Delete the server then refused. Not polled: this
# changes when somebody archives or restores, which is when it is invalidated.
query ArchivedLanes($projectId: String!, $limit: Int!) {
  cards(limit: $limit, where: { projectId: { eq: $projectId }, archivedAt: { isNotNull: true } }) {
    id
    laneId
  }
}

mutation MoveCard($cardId: String!, $laneId: String!, $position: Int) {
  moveCard(cardId: $cardId, laneId: $laneId, position: $position) {
    id
    laneId
    position
    status
  }
}

mutation RunCard($cardId: String!) {
  runCard(cardId: $cardId) {
    id
    status
    error
  }
}

mutation SetCardDeps($cardId: String!, $dependsOn: [String!]!) {
  setCardDeps(cardId: $cardId, dependsOn: $dependsOn)
}

mutation RetryCard($cardId: String!) {
  retryCard(cardId: $cardId) {
    id
    status
    error
  }
}

mutation StopCard($cardId: String!) {
  stopCard(cardId: $cardId)
}

mutation CreateCard($values: CreateCardInput!) {
  createCard(values: $values) {
    id
  }
}

mutation UpdateCard($id: String!, $set: UpdateCardInput!) {
  updateCardSingle(where: { id: { eq: $id } }, set: $set) {
    id
  }
}

mutation DeleteCard($id: String!) {
  deleteCardSingle(where: { id: { eq: $id } }) {
    id
  }
}

mutation CreateLane($values: CreateLaneInput!) {
  createLane(values: $values) {
    id
  }
}

mutation UpdateLane($id: String!, $set: UpdateLaneInput!) {
  updateLaneSingle(where: { id: { eq: $id } }, set: $set) {
    id
  }
}

mutation DeleteLane($id: String!) {
  deleteLaneSingle(where: { id: { eq: $id } }) {
    id
  }
}

# One card's actual dependencies, archived ones included — which the board query cannot show,
# because it filters archived cards out and a dep it cannot see is a dep the dialog drops.
query CardDeps($cardId: String!) {
  cardDeps(where: { cardId: { eq: $cardId } }) {
    dependsOnCardId
    dependsOn {
      id
      title
      status
      laneId
      archivedAt
    }
  }
  blockedBy: cardDeps(where: { dependsOnCardId: { eq: $cardId } }) {
    cardId
    card {
      id
      title
      status
      laneId
      archivedAt
    }
  }
}
