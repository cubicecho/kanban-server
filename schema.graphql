  """
  updateMessagesMany(updates: [UpdateMessageManyInput!]!): [Message]!
  updateMessageSingle(set: UpdateMessageInput!, where: MessageFilters!): Message
  deleteMessage(where: MessageFilters): [Message!]!
  deleteMessageSingle(where: MessageFilters!): Message
  createCards(values: [CreateCardInput!]!): [Card!]!
