query Roles {
  roles(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    description
    contract
    prompt
  }
  # Every lane on the server, for the count beside each kind: a role is deleted by whether
  # anything is still of that kind, not by whether an agent holds it. The names come with it
  # because "3 lanes" does not say which board to go and change.
  lanes {
    id
    roleId
    name
    project {
      name
    }
  }
}

mutation CreateRole($values: CreateRoleInput!) {
  createRole(values: $values) {
    id
  }
}

mutation UpdateRole($id: String!, $set: UpdateRoleInput!) {
  updateRole(where: { id: { eq: $id } }, set: $set) {
    id
  }
}

mutation DeleteRole($id: String!) {
  deleteRole(where: { id: { eq: $id } }) {
    id
  }
}
