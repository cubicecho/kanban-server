<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kanban-server</title>
    <!--
      Before first paint, not in React: the stylesheet lands with the document, so a theme
      applied from an effect means one frame of white on a dark install. Kept in step with
      `src/lib/theme.ts`, which owns the key and every read after this one.
    -->
    <script>
      try {
        var t = localStorage.getItem("kanban-server.theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
