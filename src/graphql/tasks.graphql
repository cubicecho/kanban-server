query Tasks($projectId: String!) {
  tasks(
    where: { projectId: { eq: $projectId } }
    orderBy: { createdAt: { direction: desc, priority: 1 } }
  ) {
    id
    title
    brief
    createdAt
    messages(orderBy: { createdAt: { direction: asc, priority: 1 } }) {
      id
      role
      content
    }
    cards {
      id
      title
      status
    }
  }
}

mutation CreateTask($values: CreateTaskInput!) {
  createTask(values: $values) {
    id
    title
    brief
  }
}

mutation RefineTask($taskId: String!, $message: String!) {
  refineTask(taskId: $taskId, message: $message) {
    id
    status
    error
  }
}

mutation MakeCard($taskId: String!) {
  makeCard(taskId: $taskId) {
    id
    title
    laneId
  }
}

mutation SubmitCard($projectId: String!, $title: String!, $body: String!) {
  submitCard(projectId: $projectId, title: $title, body: $body) {
    id
    title
    laneId
  }
}

mutation DeleteTask($id: String!) {
  deleteTaskSingle(where: { id: { eq: $id } }) {
    id
  }
}

mutation StopTask($taskId: String!) {
  stopTask(taskId: $taskId)
}
